name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0). Leave empty to build only.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PUB_HOSTED_URL: https://pub.dev
  FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

jobs:
  validate:
    name: Validate sources and packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Validate Rust MSRV and no_std core
        working-directory: rust
        run: |
          cargo check --workspace --all-targets --locked
          cargo check -p ferrisload-core --no-default-features --locked

      - name: Setup stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Flutter pub get
        run: flutter pub get

      - name: Validate Rust workspace
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo package -p ferrisload-core --locked --allow-dirty

      - name: Validate Flutter application
        run: |
          flutter analyze
          flutter test

  build-android:
    name: Build Android APKs
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            x86_64-linux-android

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-android-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: rust-android-

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Configure Flutter
        run: flutter config --no-analytics

      - name: Flutter pub get
        run: flutter pub get

      - name: Configure Android release signing
        shell: bash
        env:
          RELEASE_REQUESTED: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag_name != '' }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [[ "$RELEASE_REQUESTED" == "true" ]]; then
            test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is required for a release" >&2; exit 1; }
            test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is required for a release" >&2; exit 1; }
            test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is required for a release" >&2; exit 1; }
            test -n "$STORE_PASSWORD" || { echo "ANDROID_STORE_PASSWORD is required for a release" >&2; exit 1; }
          fi
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            {
              printf 'storeFile=app/release.jks\n'
              printf 'storePassword=%s\n' "$STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > android/key.properties
          fi

      - name: Build split APKs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: flutter build apk --release --split-per-abi

      - name: Collect Android artifacts
        shell: bash
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/android/FerrisLoad-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/android/FerrisLoad-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/android/FerrisLoad-android-x86_64.apk
          ls -lah dist/android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/android/*
          retention-days: 7

  build-windows:
    name: Build Windows x64
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            rust\target
          key: rust-windows-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: rust-windows-

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release bundle
        run: flutter build windows --release

      - name: Package Windows artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\windows\FerrisLoad-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/windows/FerrisLoad-windows-x64.zip
          retention-days: 7

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-macos-${{ matrix.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: rust-macos-${{ matrix.arch }}-

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package macOS artifact
        shell: bash
        run: |
          mkdir -p dist/macos
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/macos/FerrisLoad-macos-${{ matrix.arch }}.zip"
          ls -lah dist/macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/macos/FerrisLoad-macos-${{ matrix.arch }}.zip
          retention-days: 7

  build-linux:
    name: Build Linux x64 bundle
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libjsoncpp-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-linux-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: rust-linux-

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Package Linux artifact
        shell: bash
        run: |
          mkdir -p dist/linux
          tar -C build/linux/x64/release/bundle -czf dist/linux/FerrisLoad-linux-x64.tar.gz .
          ls -lah dist/linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/linux/FerrisLoad-linux-x64.tar.gz
          retention-days: 7

  docker-api:
    name: Publish Docker API image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: docker_tags
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/m3u8-downloader-api"
          TAGS=("${IMAGE}:sha-${GITHUB_SHA::7}")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
            TAGS+=("${IMAGE}:${RELEASE_TAG}" "${IMAGE}:latest")
          elif [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            RELEASE_TAG="${{ github.event.inputs.tag_name }}"
            TAGS+=("${IMAGE}:${RELEASE_TAG}" "${IMAGE}:manual")
          else
            SAFE_REF="${GITHUB_REF_NAME//\//-}"
            TAGS+=("${IMAGE}:${SAFE_REF}")
          fi
          {
            echo 'tags<<EOF'
            printf '%s\n' "${TAGS[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag_name != ''
    needs:
      - build-android
      - build-windows
      - build-macos
      - build-linux
      - docker-api
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            RELEASE_NAME="${{ github.event.inputs.tag_name }}"
          else
            RELEASE_NAME="${GITHUB_REF#refs/tags/}"
          fi
          echo "name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/m3u8-downloader-api:${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

      - name: List release files
        run: find artifacts -type f | sort

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          find artifacts -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed -E 's#  artifacts/[^/]+/#  #' > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: FerrisLoad ${{ steps.release_tag.outputs.name }}
          generate_release_notes: true
          body: |
            Docker API image: `${{ steps.release_tag.outputs.image }}`
          files: |
            artifacts/android-apks/FerrisLoad-android-arm64-v8a.apk
            artifacts/android-apks/FerrisLoad-android-armeabi-v7a.apk
            artifacts/android-apks/FerrisLoad-android-x86_64.apk
            artifacts/windows-x64/FerrisLoad-windows-x64.zip
            artifacts/macos-x64/FerrisLoad-macos-x64.zip
            artifacts/macos-arm64/FerrisLoad-macos-arm64.zip
            artifacts/linux-x64/FerrisLoad-linux-x64.tar.gz
            artifacts/SHA256SUMS
