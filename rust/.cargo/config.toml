# Allow undefined symbols when linking the iOS cdylib. The crate declares
# iOS-only `extern "C"` VideoToolbox symbols (`ferrisload_videotoolbox_*`) that
# are implemented in the App's `VideoToolboxBridge.m` and only exist at the
# final App link; the app itself consumes the STATIC library, so tolerating the
# unresolved symbols in the (unused) cdylib is safe.
#
# IMPORTANT: cargo only discovers this file from its *current working
# directory* (and ancestors). Xcode's cargokit script phase runs from a
# different directory, so these flags do NOT reach the `flutter build ios`
# build there. The effective mechanism for Xcode builds is the
# `CARGO_TARGET_*_APPLE_IOS*_RUSTFLAGS` exports in
# `rust_builder/ios/rust_lib_m3u8_downloader.podspec` (device arm64 +
# simulator arm64/x86_64); this file only covers manual
# `cargo build --target aarch64-apple-ios` runs from inside `rust/`.
[target.'cfg(target_os = "ios")']
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
