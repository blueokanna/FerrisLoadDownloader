[package]
name = "ferrisload-core"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
authors = ["blueokanna"]
description = "Portable no_std core types and wire format for FerrisLoad"
repository = "https://github.com/blueokanna/m3u8-downloader"
license-file = "../../LICENSE"
readme = "README.md"
keywords = ["m3u8", "hls", "no-std", "serialization"]
categories = ["encoding", "multimedia", "no-std"]

[features]
default = []
std = ["rustbinary/std", "serde/std"]

[dependencies]
rustbinary = { version = "0.1.4", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
