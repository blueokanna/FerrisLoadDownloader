[package]
name = "rust_lib_m3u8_downloader"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
license-file = "../LICENSE"
authors = ["blueokanna"]
description = "FerrisLoad application runtime and Flutter bridge"
repository = "https://github.com/blueokanna/m3u8-downloader"

[workspace]
members = ["core"]
resolver = "2"

[lib]
name = "rust_lib_m3u8_downloader"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aes = "0.7.5"
anyhow = "1.0.100"
block-modes = "0.8.1"
clap = { version = "4.5.48", features = ["derive"] }
ferrisload-core = { path = "core", version = "0.1.2", features = ["std"] }

flutter_rust_bridge = "=2.12.0"
futures = "0.3.31"

hex = "0.4.3"
indicatif = "0.18.3"
jni = "0.21.1"
log = "0.4.28"
env_logger = "0.11.8"

m3u8-rs = "6.0.0"
regex = "1.12.2"

reqwest = { version = "0.12.24", features = ["json", "stream", "gzip", "brotli", "deflate", "rustls-tls-webpki-roots"], default-features = false }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "fs", "process"] }
url = "2.5.7"
uuid = { version = "1", features = ["v4"] }
warp = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1.0"
quick-xml = { version = "0.38.4", features = ["serialize"] }
sha2 = "0.10.9"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[[bin]]
name = "m3u8_api_server"
path = "src/bin/m3u8_api_server.rs"
